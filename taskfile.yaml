# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PORT: "8765"

tasks:
  default:
    cmds:
      - task: check

  install:
    desc: "install the development dependencies from the lockfile"
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  format:
    desc: "format the repository"
    cmds:
      - biome format --write {{.CLI_ARGS}}

  check:
    desc: "type-check the site and the scripts"
    deps: [install]
    cmds:
      - pnpm exec tsc --build {{.CLI_ARGS}}

  test:
    desc: "run the tests"
    deps: [install]
    cmds:
      - node --test "test/**/*.test.mjs" {{.CLI_ARGS}}

  lint:
    desc: "lint the repository and check its formatting"
    cmds:
      - biome check {{.CLI_ARGS}}

  lint:fix:
    desc: "lint and fix the repository, and format it"
    aliases: [fix]
    cmds:
      - biome check --write {{.CLI_ARGS}}

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  samples:
    desc: "regenerate the sample histories in sample/"
    cmds:
      - node sample/generate.mjs {{.CLI_ARGS}}
      - node sample/edge-cases.mjs

  samples:missing:
    internal: true
    status:
      - test -f sample/data.js
      - test -f sample/edge-cases.js
    cmds:
      - task: samples

  serve:
    desc: "serve the repository for a local preview of the page over the sample history"
    deps: [samples:missing]
    cmds:
      - node scripts/serve.mjs {{.PORT}}

  screenshot:
    desc: "capture the README hero images in docs/"
    deps: [install, samples:missing]
    cmds:
      - node scripts/screenshot.mjs

  screenshot:setup:
    desc: "download the Chromium build that the pinned Playwright drives"
    deps: [install]
    cmds:
      - pnpm exec playwright install chromium {{.CLI_ARGS}}

  # The image ships the browsers for one Playwright release, so its tag follows the installed package.
  # Fonts come from the image rather than the host, which keeps captures comparable across machines.
  screenshot:docker:
    desc: "capture the README hero images inside the Playwright container"
    deps: [install, samples:missing]
    vars:
      PLAYWRIGHT_VERSION:
        sh: node -p 'require("./node_modules/playwright/package.json").version'
    cmds:
      - >-
        docker run --rm --init --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" -w /work
        mcr.microsoft.com/playwright:v{{.PLAYWRIGHT_VERSION}}-noble node scripts/screenshot.mjs

  package:
    desc: "pack the committed site/ of a ref (default HEAD) into dist/benchtrail.zip"
    vars:
      REF: '{{.REF | default "HEAD"}}'
    cmds:
      - mkdir -p dist
      - git archive --format=zip -o dist/benchtrail.zip "{{.REF}}:site"

  # The release ships the files exactly as committed at the tag, never the working tree.
  release:
    desc: "publish a GitHub release of site/ for the tag at HEAD"
    vars:
      TAG:
        sh: git describe --tags --exact-match HEAD
    cmds:
      - task: package
        vars: { REF: "{{.TAG}}" }
      - rm -rf dist/site && mkdir -p dist/site
      - git archive --format=tar "{{.TAG}}:site" | tar -x -C dist/site
      - >-
        gh release create "{{.TAG}}" --verify-tag --generate-notes --title "{{.TAG}}"
        dist/benchtrail.zip dist/site/index.html dist/site/benchtrail.js dist/site/benchtrail.css

  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - cooldown outdated --sync {{.CLI_ARGS}}

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - cooldown outdated --no-major --sync {{.CLI_ARGS}}

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - cooldown upgrade --major --sync {{.CLI_ARGS}}

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - cooldown upgrade --no-major --sync {{.CLI_ARGS}}

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - cooldown upgrade --latest {{.CLI_ARGS}}
