<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Benchmarks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12l4-4 3 3 7-8' fill='none' stroke='%232a78d6' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="benchtrail.css" />
    <!-- Apply a stored theme before first paint, so a dark-mode reader never sees a light flash. -->
    <script>
      try {
        const theme = localStorage.getItem("benchtrail:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
      integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD"
      crossorigin="anonymous"
      defer
    ></script>
    <!--
      Page settings, all optional:
      - "title": heading text; defaults to the repository name from the data.
      - "dataUrl": the history script; a same-origin `?data=` query parameter overrides it.
      - "threshold": relative change that counts as a regression or improvement.
      - "labels": display names for metrics, keyed by the metric part of a benchmark name.
      - "split": regex with `series` and `metric` groups that splits a benchmark name.
    -->
    <script id="benchtrail-config" type="application/json">
      {
        "dataUrl": "data.js",
        "threshold": 0.05,
        "labels": {}
      }
    </script>
    <script type="module" src="benchtrail.js"></script>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="top">
          <h1><a id="project-link">Benchmarks</a></h1>
          <button type="button" id="theme" class="theme">Theme: auto</button>
        </div>
        <p id="summary" class="meta"></p>
        <nav id="suites" class="suites" aria-label="Benchmark suites" hidden></nav>
        <div id="controls" class="controls" hidden>
          <div class="filters">
            <div class="filter" role="group" aria-label="Series" id="series"></div>
            <div class="filter" role="group" aria-label="Metrics" id="metrics"></div>
          </div>
          <button type="button" id="options-toggle" class="option" aria-expanded="false" aria-controls="options">Options</button>
        </div>
        <div id="options" class="options" hidden>
          <div class="filter" role="radiogroup" aria-labelledby="range-label">
            <span class="filter-label" id="range-label">Runs</span>
            <span id="range" class="filter"></span>
          </div>
          <div class="filter" role="radiogroup" aria-labelledby="scale-label">
            <span class="filter-label" id="scale-label">Values</span>
            <span id="scale" class="filter"></span>
          </div>
          <div class="filter" role="radiogroup" aria-labelledby="axis-label">
            <span class="filter-label" id="axis-label">X axis</span>
            <span id="axis" class="filter"></span>
          </div>
        </div>
      </header>

      <main id="main" hidden>
        <div id="trail-chart" class="trail-chart" role="img" aria-label="Largest change per run"></div>
        <section id="charts" class="charts" aria-label="Charts"></section>
        <section id="selected" class="details" aria-live="polite"></section>
        <section>
          <div class="history-head">
            <button type="button" id="list-toggle" class="option" aria-expanded="false" aria-controls="history">Show runs</button>
            <input id="search" class="search" type="search" placeholder="Search runs" aria-label="Search runs by commit, message, or author" hidden />
            <button type="button" id="only-changes" class="option" aria-pressed="false" hidden></button>
          </div>
          <div id="history" hidden>
            <div class="table-wrap">
              <table id="history-table" class="history-table"></table>
            </div>
            <button type="button" id="more" class="more" hidden></button>
          </div>
        </section>
      </main>

      <div id="problem" class="problem" role="alert" hidden></div>
    </div>
  </body>
</html>
