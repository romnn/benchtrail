# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: pages

# Deploys a github-action-benchmark history to GitHub Pages as a site of its own, for a repository
# whose Pages site is nothing else.
# A workflow calls it from a job that runs after its benchmarks, and Pages publishes from Actions.
# A site that also holds documentation runs the benchtrail action in its own build instead.
on:
  workflow_call:
    inputs:
      gh-pages-branch:
        description: The branch github-action-benchmark records the history on.
        type: string
        default: gh-pages
      benchmark-data-dir-path:
        description: The history's directory on that branch.
        type: string
        default: dev/bench
      path:
        description: Where the dashboard sits in the site, such as `bench`, or `.` for its root; the history's directory by default.
        type: string
        default: ""
      settings:
        description: The page's settings as a JSON object.
        type: string
        default: ""
      allow-missing-history:
        description: Whether to deploy when the branch holds no history yet, rather than failing.
        type: boolean
        default: false
    outputs:
      page_url:
        description: The address of the deployed site.
        value: ${{ jobs.deploy.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, from reading the history to publishing it, so the last one to finish
    # never publishes an older history than one before it.
    # The group has its own name, since a caller that held the group GitHub's Pages template uses
    # would wait on this job forever.
    concurrency:
      group: benchtrail-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A called workflow cannot name the release it was called at, so it pins its own release, which
      # the release bump keeps in step.
      - uses: romnn/benchtrail@v0.4.0
        with:
          path: _site/${{ inputs.path || inputs.benchmark-data-dir-path }}
          gh-pages-branch: ${{ inputs.gh-pages-branch }}
          benchmark-data-dir-path: ${{ inputs.benchmark-data-dir-path }}
          settings: ${{ inputs.settings }}
          allow-missing-history: ${{ inputs.allow-missing-history }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
