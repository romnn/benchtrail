# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: test
on:
  push: {}
  workflow_call: {}
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task node npm:pnpm
      - name: Test
        run: task test

  # Runs the action as a workflow uses it, on each runner's own Node and without the development
  # dependencies: into a directory that holds a history, and with the history read from a branch.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Record a history
        shell: bash
        run: |
          mkdir -p _site/bench
          echo 'window.BENCHMARK_DATA = { "entries": {} };' > _site/bench/data.js
      - uses: ./
        with:
          path: _site/bench
          fetch-history: false
          settings: |
            { "title": "Sample benchmarks", "smoothing": 5 }
      # This repository records no history, so the read asks GitHub and finds none.
      - uses: ./
        with:
          path: _site/remote
          allow-missing-history: true
      - name: Check the installed dashboard
        shell: bash
        run: |
          cd _site/bench
          test -f index.html && test -f benchtrail.js && test -f benchtrail/core/config.js
          grep -q '"title": "Sample benchmarks"' benchtrail.json
          grep -q BENCHMARK_DATA data.js
          test -f ../remote/index.html && test ! -e ../remote/data.js
